<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Historial de Batallas - Card Battle
    </title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <link
        rel="stylesheet"
        href="./css/componentes.css"
    >

    <script
        type="module"
        src="./js/app.js"
    ></script>

</head>


<body>

    <main>

        <header class="encabezado-juego">

        </header>


        <section>

            <div class="seccion-cabecera">

                <h2>
                    Batallas anteriores

            </div>


            <div id="historialBatallas"></div>

        </section>


        <div class="acciones-principales">

                ← Volver a la Arena

        </div>

    </main>

</html>
