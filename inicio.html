<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Clash Royale</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/componentes.css">

    <script type="module" src="./js/app.js"></script>
</head>
<body>
    
    <main>

        <h1>Preparacion del Jugador</h1>

        <p>Ingresa tu nombre o tu alias:</p>

        <input 
            type="text"
            id="nombreJugador"
            placeholder="Escribe tu nombre o alias"        
        >

        <h2>Elige tu clase</h2>

        <div id="clases">
            <button class="clase" data-clase="Astuto">
                Astuto
            </button>

            <button class="clase" data-clase="Astuto">
                Temerario
            </button>

            <button class="clase" data-clase="Astuto">
                Cauteloso
            </button>

            <button class="clase" data-clase="Astuto">
                Velocista
            </button>

            <button class="clase" data-clase="Astuto">
                Ser de sombra
            </button>

        </div>

        <p id="descripcionClase">
            Selecciona una clase para conocer su estilo.
        </p>

        <p id="claseSeleccionada">
            Clase seleccionada: Ninguna
        </p>

        <p id="mensaje"></p>

        <button id="btnContinuar">
            Continuar
        </button>

    </main>
    
</body>
</html>
