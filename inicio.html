<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Preparación del Jugador - Card Battle
    </title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <link
        rel="stylesheet"
        href="./css/componentes.css"
    >

    <script
        type="module"
        src="./js/app.js"
    ></script>

</head>


<body>

    <main class="panel-juego--compacto">

        <header class="encabezado-juego">

            <div class="logo-badge">
                Preparación
            </div>

            <h1>
                Tu Guerrero
            </h1>

            <p class="subtitulo">
                Crea tu identidad antes de entrar
                a la arena.
            </p>

        </header>


        <section>

            <div class="grupo-campo">

                <label for="nombreJugador">
                    Nombre o alias
                </label>

                <input
                    type="text"
                    id="nombreJugador"
                    maxlength="20"
                    placeholder="Ejemplo: DarkKnight"
                    autocomplete="off"
                >

            </div>


            <h2>
                Elige tu clase
            </h2>


            <div id="clases">

                <button
                    class="clase"
                    data-clase="Astuto"
                >
                    🧠 Astuto
                </button>


                <button
                    class="clase"
                    data-clase="Temerario"
                >
                    🔥 Temerario
                </button>


                <button
                    class="clase"
                    data-clase="Cauteloso"
                >
                    🛡️ Cauteloso
                </button>


                <button
                    class="clase"
                    data-clase="Velocista"
                >
                    ⚡ Velocista
                </button>


                <button
                    class="clase"
                    data-clase="Ser de sombra"
                >
                    🌑 Ser de sombra
                </button>

            </div>


            <p id="descripcionClase">
                Selecciona una clase para conocer
                su estilo.
            </p>


            <p id="claseSeleccionada">
                Clase seleccionada: Ninguna
            </p>


            <p id="mensaje"></p>


            <div class="acciones-principales">

                <button
                    id="btnContinuar"
                    type="button"
                >
                    Continuar a la Arena
                </button>

            </div>

        </section>

    </main>

</body>

</html>
