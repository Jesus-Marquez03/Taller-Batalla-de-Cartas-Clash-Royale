<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena de Batalla - Clash Royale</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/componentes.css">

    <script type="module" src="./js/app.js"></script>
</head>

<body>
    
    <main>

        <h1>Arena de Batalla</h1>

        <section>

            <h2>Mazo de Batalla</h2>

            <p>
                !Elige 5 cartas para crear tu mazo y luchar!
            </p>

            <p id="contadorCartas">
                Cartas seleccionadas: 0/5
            </p>

            <div id="mazoJugador"></div>

            <button id="btnMazoAzar">
                Mazo al azar
            </button>

        </section>

        <section>

            <h2>Cartas disponibles</h2>

            <div id="cartasDisponibles"></div>

        </section>

        <p id="mensajeBatalla"></p>

        <button id="btnIrLuchar">
            Ir a luchar
        </button>

        <section id="arenaCombate">

            <h2> Arena de Combate </h2>

            <p id="turnoActual">
                Turno del jugador
            </p>

            <div id="campoBatalla">

                <div id="cartaJugador">

                    <h3>Tu carta</h3>

                    <div id="datosCartaJugador"></div>

                    <p>
                        Vida:
                        <span id="vidaJugador">0</span>
                    </p>

                </div>

                <div id="cartaEnemigo">

                    <h3>Carta enemiga</h3>

                    <div id="datosCartaEnemigo"></div>

                    <p>
                        Vida:
                        <span id="vidaEnemigo">0</span>
                    </p>

                </div>

            </div>

            <div id="ataques">

                <h3>Elige tu ataque</h3>

                <button id="btnAtacar">
                    Atacar
                </button>

            </div>

            <p id="mensajeCombate"></p>

        </section>

    <!-- ==========================================
     VENTANA DE RESULTADO
     ========================================== -->

    <div id="ventanaResultado" class="ventanaResultado">

        <div class="contenidoResultado">

            <h2 id="tituloResultado">
                Resultado
            </h2>

            <p id="marcadorResultado">
                0 - 0
            </p>

            <p id="mensajeResultado">
                Resultado de la batalla
            </p>

            <button id="btnContinuar">
                Continuar
            </button>

        </div>

    </div>
    
    </main>
    
</body>
</html>
