<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena de Batalla - Clash Royale</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/componentes.css">

    <script type="module" src="./js/app.js"></script>
</head>

<body>
    
    <main>

        <h1>Arena de Batalla</h1>

        <section>

            <h2>Mazo de Batalla</h2>

            <p>
                !Elige 5 cartas para crear tu mazo y luchar!
            </p>

            <p id="contadorCartas">
                Cartas seleccionadas: 0/5
            </p>

            <div id="mazoJugador"></div>

            <button id="btnMazoAzar">
                Mazo al azar
            </button>

        </section>

        <section>

            <h2>Cartas disponibles</h2>

            <div id="cartasDisponibles"></div>

        </section>

        <p id="mensajeBatalla"></p>

        <button id="btnIrLuchar">
            Ir a luchar
        </button>

    </main>
    
</body>
</html>
